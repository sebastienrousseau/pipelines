name: Security

on:
  workflow_call:
    inputs:
      language:
        description: 'Project language (rust, python, node, go, auto)'
        default: 'auto'
        type: string
      fail-on-vulnerability:
        description: 'Fail if vulnerabilities are found'
        default: true
        type: boolean
      severity-threshold:
        description: 'Minimum severity to report (low, moderate, high, critical)'
        default: 'moderate'
        type: string
      runner:
        description: 'Runner label (e.g. ubuntu-latest, ubuntu-24.04-arm)'
        default: 'ubuntu-latest'
        type: string
      allow-ghsas:
        description: 'Comma-separated GHSA IDs to allow in dependency review'
        default: ''
        type: string

permissions: {}

jobs:
  detect-language:
    name: Detect Language
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      language: ${{ steps.detect.outputs.language }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          sparse-checkout: |
            Cargo.toml
            pyproject.toml
            requirements.txt
            package.json
            go.mod
          sparse-checkout-cone-mode: false
          persist-credentials: false
          show-progress: false

      - name: Detect language
        id: detect
        run: |
          if [ "${{ inputs.language }}" != "auto" ]; then
            echo "language=${{ inputs.language }}" >> "$GITHUB_OUTPUT"
          elif [ -f "Cargo.toml" ]; then
            echo "language=rust" >> "$GITHUB_OUTPUT"
          elif [ -f "go.mod" ]; then
            echo "language=go" >> "$GITHUB_OUTPUT"
          elif [ -f "pyproject.toml" ] || [ -f "requirements.txt" ]; then
            echo "language=python" >> "$GITHUB_OUTPUT"
          elif [ -f "package.json" ]; then
            echo "language=node" >> "$GITHUB_OUTPUT"
          else
            echo "language=unknown" >> "$GITHUB_OUTPUT"
          fi

  rust-audit:
    name: Rust Security Audit
    runs-on: ${{ inputs.runner }}
    needs: detect-language
    if: needs.detect-language.outputs.language == 'rust'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: cargo-audit
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: cargo-deny

      - name: Run cargo audit
        run: cargo audit --deny warnings
        continue-on-error: ${{ !inputs.fail-on-vulnerability }}

      - name: Run cargo deny
        run: cargo deny check
        continue-on-error: true

  go-audit:
    name: Go Security Audit
    runs-on: ${{ inputs.runner }}
    needs: detect-language
    if: needs.detect-language.outputs.language == 'go'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Run govulncheck
        run: govulncheck ./...
        continue-on-error: ${{ !inputs.fail-on-vulnerability }}

  python-audit:
    name: Python Security Audit
    runs-on: ${{ inputs.runner }}
    needs: detect-language
    if: needs.detect-language.outputs.language == 'python'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # The hash-pinned requirements live in this repository's
      # requirements/ directory and are fetched at the exact commit of
      # this workflow, so a caller pinning this workflow by SHA also
      # pins every tool it installs. actionlint 1.7.12 does not know
      # job.workflow_sha yet, so the step reads it from toJSON(job).
      - name: Fetch hash-pinned tool requirements
        env:
          JOB_CONTEXT: ${{ toJSON(job) }}
          FILES: pip-audit poetry
        run: |
          repo=$(jq -r '.workflow_repository // empty' <<<"$JOB_CONTEXT")
          sha=$(jq -r '.workflow_sha // empty' <<<"$JOB_CONTEXT")
          if [ -z "$repo" ] || [ -z "$sha" ]; then
            echo "::error::job.workflow_sha is unavailable, so the pinned requirements cannot be fetched"
            exit 1
          fi
          dir="$RUNNER_TEMP/pipelines-requirements"
          mkdir -p "$dir"
          for f in $FILES; do
            curl -fsSL --proto '=https' --retry 3 -o "$dir/$f.txt" \
              "https://raw.githubusercontent.com/$repo/$sha/requirements/$f.txt"
          done

      - name: Install tools
        run: pip install --no-cache-dir --require-hashes -r "$RUNNER_TEMP/pipelines-requirements/pip-audit.txt"

      - name: Run pip-audit
        run: |
          if [ -f "requirements.txt" ]; then
            pip-audit -r requirements.txt
          elif [ -f "pyproject.toml" ]; then
            pip install --no-cache-dir --require-hashes -r "$RUNNER_TEMP/pipelines-requirements/poetry.txt"
            poetry export -f requirements.txt --output /tmp/requirements.txt
            pip-audit -r /tmp/requirements.txt
          fi
        continue-on-error: ${{ !inputs.fail-on-vulnerability }}

      - name: Run bandit
        run: |
          if [ -d "src" ]; then
            bandit -r src/ -ll
          else
            bandit -r . -ll --exclude ./tests,./venv,./.venv
          fi
        continue-on-error: ${{ !inputs.fail-on-vulnerability }}

  node-audit:
    name: Node Security Audit
    runs-on: ${{ inputs.runner }}
    needs: detect-language
    if: needs.detect-language.outputs.language == 'node'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Run npm audit
        run: npm audit --audit-level=${{ inputs.severity-threshold }}
        continue-on-error: ${{ !inputs.fail-on-vulnerability }}

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    needs: detect-language
    if: needs.detect-language.outputs.language != 'unknown'
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v3
        with:
          languages: ${{ needs.detect-language.outputs.language == 'node' && 'javascript' || needs.detect-language.outputs.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v3

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: ${{ inputs.severity-threshold }}
          allow-ghsas: ${{ inputs.allow-ghsas }}
