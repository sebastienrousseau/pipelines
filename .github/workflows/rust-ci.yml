name: Rust CI

on:
  workflow_call:
    inputs:
      rust-version:
        description: 'Rust toolchain version'
        default: 'stable'
        type: string
      cargo-features:
        description: 'Cargo features to enable (empty = --all-features)'
        default: ''
        type: string
      run-clippy:
        description: 'Run clippy linting'
        default: true
        type: boolean
      run-fmt:
        description: 'Check formatting'
        default: true
        type: boolean
      run-audit:
        description: 'Run security audit'
        default: true
        type: boolean
      run-coverage:
        description: 'Generate coverage report'
        default: false
        type: boolean
      run-cross-platform:
        description: 'Run tests on macOS and Windows'
        default: false
        type: boolean
      coverage-exclude:
        description: 'Files to exclude from coverage (comma-separated globs)'
        default: ''
        type: string
      coverage-exclude-packages:
        description: 'Comma-separated list of packages to exclude from coverage'
        default: ''
        type: string
      runner:
        description: 'Runner label (e.g. ubuntu-latest, ubuntu-24.04-arm)'
        default: 'ubuntu-latest'
        type: string
      timeout-minutes:
        description: 'Timeout for the main check job'
        default: 20
        type: number
    secrets:
      CODECOV_TOKEN:
        description: 'Codecov upload token'
        required: false

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_NET_RETRY: 2
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  RUST_BACKTRACE: short

jobs:
  check:
    name: Check & Test
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Install Rust
        id: toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ inputs.rust-version }}
          components: rustfmt, clippy

      # dtolnay/rust-toolchain only runs `rustup default`, and a caller's
      # rust-toolchain.toml beats the default. A repo that pins `stable`
      # there ran its MSRV and nightly jobs on stable while they reported
      # green. RUSTUP_TOOLCHAIN beats the file, so export it for every
      # later step, then prove the compiler in use is the one requested.
      - name: Pin the requested toolchain
        shell: bash
        env:
          TOOLCHAIN: ${{ steps.toolchain.outputs.name }}
        run: echo "RUSTUP_TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"

      - name: Verify the toolchain in use
        shell: bash
        env:
          REQUESTED: ${{ inputs.rust-version }}
          TOOLCHAIN: ${{ steps.toolchain.outputs.name }}
        run: |
          actual="$(rustc --version)"
          expected="$(rustc "+$TOOLCHAIN" --version)"
          case "$REQUESTED" in
            stable) pattern='^rustc [0-9]+\.[0-9]+\.[0-9]+ \(' ;;
            beta) pattern='-beta' ;;
            nightly*) pattern='-nightly' ;;
            [0-9]*) pattern="^rustc ${REQUESTED//./\\.}[. ]" ;;
            *) pattern='' ;;
          esac
          echo "requested $REQUESTED, in use: $actual"
          if [ "$actual" != "$expected" ] || ! grep -Eq -- "${pattern:-.}" <<<"$actual"; then
            echo "::error::rustc in use is '$actual', not the requested $REQUESTED ($expected)"
            exit 1
          fi

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Format
        if: inputs.run-fmt
        run: cargo fmt --all -- --check

      - name: Clippy
        if: inputs.run-clippy
        run: |
          if [ -n "${{ inputs.cargo-features }}" ]; then
            cargo clippy --workspace --all-targets --no-deps --features "${{ inputs.cargo-features }}" -- -D warnings
          else
            cargo clippy --workspace --all-targets --no-deps --all-features -- -D warnings
          fi

      - name: Test
        run: |
          if [ -n "${{ inputs.cargo-features }}" ]; then
            cargo test --workspace --features "${{ inputs.cargo-features }}"
          else
            cargo test --workspace --all-features
          fi

  cross:
    name: Test (${{ matrix.os }})
    if: inputs.run-cross-platform
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
    strategy:
      fail-fast: true
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Install Rust
        id: toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ inputs.rust-version }}

      # dtolnay/rust-toolchain only runs `rustup default`, and a caller's
      # rust-toolchain.toml beats the default. A repo that pins `stable`
      # there ran its MSRV and nightly jobs on stable while they reported
      # green. RUSTUP_TOOLCHAIN beats the file, so export it for every
      # later step, then prove the compiler in use is the one requested.
      - name: Pin the requested toolchain
        shell: bash
        env:
          TOOLCHAIN: ${{ steps.toolchain.outputs.name }}
        run: echo "RUSTUP_TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"

      - name: Verify the toolchain in use
        shell: bash
        env:
          REQUESTED: ${{ inputs.rust-version }}
          TOOLCHAIN: ${{ steps.toolchain.outputs.name }}
        run: |
          actual="$(rustc --version)"
          expected="$(rustc "+$TOOLCHAIN" --version)"
          case "$REQUESTED" in
            stable) pattern='^rustc [0-9]+\.[0-9]+\.[0-9]+ \(' ;;
            beta) pattern='-beta' ;;
            nightly*) pattern='-nightly' ;;
            [0-9]*) pattern="^rustc ${REQUESTED//./\\.}[. ]" ;;
            *) pattern='' ;;
          esac
          echo "requested $REQUESTED, in use: $actual"
          if [ "$actual" != "$expected" ] || ! grep -Eq -- "${pattern:-.}" <<<"$actual"; then
            echo "::error::rustc in use is '$actual', not the requested $REQUESTED ($expected)"
            exit 1
          fi

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false

      - name: Test
        run: |
          if [ -n "${{ inputs.cargo-features }}" ]; then
            cargo test --workspace --features "${{ inputs.cargo-features }}"
          else
            cargo test --workspace --all-features
          fi
        shell: bash

  audit:
    name: Audit
    if: inputs.run-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      # rustsec/audit-check compiles cargo-audit from source on every run,
      # which costs ~190s and made this the critical path for the whole
      # workflow. install-action fetches a prebuilt binary instead.
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: cargo-audit

      # Plain `cargo audit` fails on vulnerabilities only, matching what
      # audit-check gated on. `--deny warnings` would also fail on
      # unmaintained and yanked advisories, which is a stricter policy than
      # the repos consuming this workflow have agreed to.
      - name: Audit
        run: cargo audit

  coverage:
    name: Coverage
    if: inputs.run-coverage
    # Deliberately not `needs: check`. Coverage builds the workspace
    # itself, so gating it on check bought no reuse and simply idled it
    # through check's runtime — ~30s of pure critical path.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Install Rust
        id: toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ inputs.rust-version }}

      # dtolnay/rust-toolchain only runs `rustup default`, and a caller's
      # rust-toolchain.toml beats the default. A repo that pins `stable`
      # there ran its MSRV and nightly jobs on stable while they reported
      # green. RUSTUP_TOOLCHAIN beats the file, so export it for every
      # later step, then prove the compiler in use is the one requested.
      - name: Pin the requested toolchain
        shell: bash
        env:
          TOOLCHAIN: ${{ steps.toolchain.outputs.name }}
        run: echo "RUSTUP_TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"

      - name: Verify the toolchain in use
        shell: bash
        env:
          REQUESTED: ${{ inputs.rust-version }}
          TOOLCHAIN: ${{ steps.toolchain.outputs.name }}
        run: |
          actual="$(rustc --version)"
          expected="$(rustc "+$TOOLCHAIN" --version)"
          case "$REQUESTED" in
            stable) pattern='^rustc [0-9]+\.[0-9]+\.[0-9]+ \(' ;;
            beta) pattern='-beta' ;;
            nightly*) pattern='-nightly' ;;
            [0-9]*) pattern="^rustc ${REQUESTED//./\\.}[. ]" ;;
            *) pattern='' ;;
          esac
          echo "requested $REQUESTED, in use: $actual"
          if [ "$actual" != "$expected" ] || ! grep -Eq -- "${pattern:-.}" <<<"$actual"; then
            echo "::error::rustc in use is '$actual', not the requested $REQUESTED ($expected)"
            exit 1
          fi

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false

      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          # Pinned: "latest" resolved to 0.35.2 through this action
          # version, whose profile parser cannot read LLVM 23 profiles.
          tool: cargo-tarpaulin@0.37.5

      - name: Generate coverage
        run: |
          TARPAULIN_ARGS=(--out Lcov --no-fail-fast)
          if [ -n "${{ inputs.cargo-features }}" ]; then
            TARPAULIN_ARGS+=(--features "${{ inputs.cargo-features }}")
          else
            TARPAULIN_ARGS+=(--all-features)
          fi
          if [ -n "${{ inputs.coverage-exclude }}" ]; then
            IFS=',' read -ra PARTS <<< "${{ inputs.coverage-exclude }}"
            for part in "${PARTS[@]}"; do
              TARPAULIN_ARGS+=(--exclude-files "$(echo "$part" | xargs)")
            done
          fi
          if [ -n "${{ inputs.coverage-exclude-packages }}" ]; then
            TARPAULIN_ARGS+=(--workspace)
            IFS=',' read -ra PKGS <<< "${{ inputs.coverage-exclude-packages }}"
            for pkg in "${PKGS[@]}"; do
              TARPAULIN_ARGS+=(--exclude "$(echo "$pkg" | xargs)")
            done
          fi
          cargo tarpaulin "${TARPAULIN_ARGS[@]}"
        env:
          # -Clink-dead-code keeps tarpaulin's line attribution honest.
          # -Ccodegen-units=1 was also set; measured at ~2s of an 86s step,
          # so it is dropped as needless serialisation rather than as a
          # speedup. The step's cost is tarpaulin's instrumented rebuild.
          RUSTFLAGS: '-Clink-dead-code -Coverflow-checks=off'

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
