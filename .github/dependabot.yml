# Dependabot for this repository (templates/dependabot.yml is the copy
# for callers). It keeps the actions pinned by SHA in the workflows and
# the hash-pinned tool locks in requirements/ current. A release must be
# 14 days old before Dependabot proposes it.

version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "UTC"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"

  # The locks are generated by `uv pip compile --universal
  # --generate-hashes` from the .in files beside them; each header
  # names the exact command.
  - package-ecosystem: pip
    directory: "/requirements"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "UTC"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 10
    groups:
      python-tools:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
