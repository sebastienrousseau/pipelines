# PR Labeler Pipeline
#
# Automatically labels pull requests based on file paths and size.
# Copy .github/labeler.yml to your repository to configure labels.
#
# Usage:
#   jobs:
#     label:
#       uses: sebastienrousseau/pipelines/.github/workflows/labeler.yml@main

name: PR Labeler

on:
  workflow_call:
    inputs:
      config-path:
        description: 'Path to labeler config'
        default: '.github/labeler.yml'
        type: string

permissions: {}

jobs:
  label:
    name: Label PR
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: ${{ inputs.config-path }}
          sync-labels: true

      - uses: codelytv/pr-size-labeler@19c335e7695ba922de938806dd129f0a9b992644 # v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_label: 'size/xs'
          xs_max_size: 10
          s_label: 'size/s'
          s_max_size: 100
          m_label: 'size/m'
          m_max_size: 500
          l_label: 'size/l'
          l_max_size: 1000
          xl_label: 'size/xl'
          fail_if_xl: false
