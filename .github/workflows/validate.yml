# Self-validation for the pipelines repository.
# Ensures all workflow YAML is syntactically valid.

name: Validate

on:
  push:
    paths:
      - '.github/workflows/**'
      - 'templates/**'
  # Every pull request: "Validate Workflows" is a required check on main,
  # so a path filter here left PRs that change only docs unmergeable.
  pull_request:

permissions: {}

jobs:
  validate:
    name: Validate Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color

      - name: yamllint
        run: |
          pip install --no-cache-dir --require-hashes -r requirements/yamllint.txt
          yamllint -d '{extends: default, rules: {line-length: {max: 200}, truthy: disable, comments-indentation: disable, document-start: disable}}' .github/workflows/ templates/

      - name: Structural tests
        run: bash tests/validate.sh
