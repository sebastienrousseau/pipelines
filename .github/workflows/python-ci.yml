name: Python CI

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Primary Python version'
        default: '3.12'
        type: string
      python-versions:
        description: 'JSON array of versions for matrix testing'
        default: '["3.11", "3.12"]'
        type: string
      run-mypy:
        description: 'Run type checking'
        default: true
        type: boolean
      run-ruff:
        description: 'Run ruff linting'
        default: true
        type: boolean
      ruff-version:
        description: >-
          Pinned ruff version. With package-manager uv any version works and
          an empty string installs the latest release. pip and poetry install
          ruff from the hash-pinned requirements/ruff.txt, so they accept only
          the version locked there (the default).
        default: '0.16.1'
        type: string
      mypy-version:
        description: >-
          Pinned mypy version for package-manager pip, which installs it from
          the hash-pinned requirements/mypy.txt and accepts only the version
          locked there (the default). poetry and uv run the project's own mypy.
        default: '2.3.0'
        type: string
      requirements-file:
        description: >-
          Hash-pinned requirements file that package-manager pip installs
          before the project itself (with --no-deps). Generate it with
          `uv pip compile pyproject.toml --extra dev --universal
          --generate-hashes -o requirements-dev.txt`.
        default: 'requirements-dev.txt'
        type: string
      run-coverage:
        description: 'Generate coverage report'
        default: false
        type: boolean
      coverage-threshold:
        description: 'Minimum coverage percentage'
        default: 80
        type: number
      package-manager:
        description: 'Package manager (poetry, pip, uv)'
        default: 'uv'
        type: string
      runner:
        description: 'Runner label (e.g. ubuntu-latest, ubuntu-24.04-arm)'
        default: 'ubuntu-latest'
        type: string
      timeout-minutes:
        description: 'Timeout for jobs'
        default: 15
        type: number
    secrets:
      CODECOV_TOKEN:
        description: 'Codecov upload token'
        required: false

permissions: {}

jobs:
  check:
    name: Check
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install uv
        if: inputs.package-manager == 'uv'
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      # The hash-pinned requirements live in this repository's
      # requirements/ directory and are fetched at the exact commit of
      # this workflow, so a caller pinning this workflow by SHA also
      # pins every tool it installs. actionlint 1.7.12 does not know
      # job.workflow_sha yet, so the step reads it from toJSON(job).
      - name: Fetch hash-pinned tool requirements
        if: inputs.package-manager != 'uv'
        env:
          JOB_CONTEXT: ${{ toJSON(job) }}
          FILES: ruff mypy poetry
        run: |
          repo=$(jq -r '.workflow_repository // empty' <<<"$JOB_CONTEXT")
          sha=$(jq -r '.workflow_sha // empty' <<<"$JOB_CONTEXT")
          if [ -z "$repo" ] || [ -z "$sha" ]; then
            echo "::error::job.workflow_sha is unavailable, so the pinned requirements cannot be fetched"
            exit 1
          fi
          dir="$RUNNER_TEMP/pipelines-requirements"
          mkdir -p "$dir"
          for f in $FILES; do
            curl -fsSL --proto '=https' --retry 3 -o "$dir/$f.txt" \
              "https://raw.githubusercontent.com/$repo/$sha/requirements/$f.txt"
          done

      # Ruff runs BEFORE deps — it only needs source files, fail-fast on lint.
      # RUFF_SPEC is pinned by default: an unpinned install means a new ruff
      # release can turn every consumer's CI red with no change on their side,
      # and new rules or formatter changes ship in minor versions.
      - name: Ruff check
        if: inputs.run-ruff
        env:
          RUFF_VERSION: ${{ inputs.ruff-version }}
        run: |
          if [ -n "$RUFF_VERSION" ]; then UVX_SPEC="ruff@$RUFF_VERSION"; else UVX_SPEC="ruff"; fi
          echo "UVX_SPEC=$UVX_SPEC" >> "$GITHUB_ENV"
          case "${{ inputs.package-manager }}" in
            uv) uvx "$UVX_SPEC" check . ;;
            *)
              lock="$RUNNER_TEMP/pipelines-requirements/ruff.txt"
              locked="$(sed -n 's/^ruff==\([^ ;]*\).*/\1/p' "$lock")"
              if [ "$RUFF_VERSION" != "$locked" ]; then
                echo "::error::ruff-version '$RUFF_VERSION' needs package-manager uv: pip and poetry install the hash-pinned ruff $locked"
                exit 1
              fi
              pip install --no-cache-dir --require-hashes -r "$lock" && ruff check .
              ;;
          esac

      - name: Ruff format
        if: inputs.run-ruff
        run: |
          case "${{ inputs.package-manager }}" in
            uv) uvx "$UVX_SPEC" format --check . ;;
            *)  ruff format --check . ;;
          esac

      # Deps only needed for mypy
      - name: Install dependencies
        if: inputs.run-mypy
        env:
          REQUIREMENTS_FILE: ${{ inputs.requirements-file }}
        run: |
          case "${{ inputs.package-manager }}" in
            poetry)
              pip install --no-cache-dir --require-hashes -r "$RUNNER_TEMP/pipelines-requirements/poetry.txt"
              poetry install
              ;;
            uv)
              uv sync --dev
              ;;
            *)
              if [ ! -f "$REQUIREMENTS_FILE" ]; then
                echo "::error::package-manager pip needs the hash-pinned '$REQUIREMENTS_FILE' (see the requirements-file input)"
                exit 1
              fi
              pip install --no-cache-dir --require-hashes -r "$REQUIREMENTS_FILE"
              pip install --no-cache-dir --no-deps -e .
              ;;
          esac

      - name: Mypy
        if: inputs.run-mypy
        env:
          MYPY_VERSION: ${{ inputs.mypy-version }}
        run: |
          case "${{ inputs.package-manager }}" in
            poetry) poetry run mypy src/ || poetry run mypy . ;;
            uv)     uv run mypy src/ || uv run mypy . ;;
            *)
              lock="$RUNNER_TEMP/pipelines-requirements/mypy.txt"
              locked="$(sed -n 's/^mypy==\([^ ;]*\).*/\1/p' "$lock")"
              if [ "$MYPY_VERSION" != "$locked" ]; then
                echo "::error::mypy-version '$MYPY_VERSION' is not the hash-pinned mypy $locked that package-manager pip installs"
                exit 1
              fi
              pip install --no-cache-dir --require-hashes -r "$lock" && (mypy src/ || mypy .)
              ;;
          esac

  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: check
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        python-version: ${{ fromJson(inputs.python-versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        if: inputs.package-manager == 'uv'
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      # The hash-pinned requirements live in this repository's
      # requirements/ directory and are fetched at the exact commit of
      # this workflow, so a caller pinning this workflow by SHA also
      # pins every tool it installs. actionlint 1.7.12 does not know
      # job.workflow_sha yet, so the step reads it from toJSON(job).
      - name: Fetch hash-pinned tool requirements
        if: inputs.package-manager == 'poetry'
        env:
          JOB_CONTEXT: ${{ toJSON(job) }}
          FILES: poetry
        run: |
          repo=$(jq -r '.workflow_repository // empty' <<<"$JOB_CONTEXT")
          sha=$(jq -r '.workflow_sha // empty' <<<"$JOB_CONTEXT")
          if [ -z "$repo" ] || [ -z "$sha" ]; then
            echo "::error::job.workflow_sha is unavailable, so the pinned requirements cannot be fetched"
            exit 1
          fi
          dir="$RUNNER_TEMP/pipelines-requirements"
          mkdir -p "$dir"
          for f in $FILES; do
            curl -fsSL --proto '=https' --retry 3 -o "$dir/$f.txt" \
              "https://raw.githubusercontent.com/$repo/$sha/requirements/$f.txt"
          done

      - name: Install dependencies
        env:
          REQUIREMENTS_FILE: ${{ inputs.requirements-file }}
        run: |
          case "${{ inputs.package-manager }}" in
            poetry)
              pip install --no-cache-dir --require-hashes -r "$RUNNER_TEMP/pipelines-requirements/poetry.txt"
              poetry install
              ;;
            uv)
              uv sync --dev
              ;;
            *)
              if [ ! -f "$REQUIREMENTS_FILE" ]; then
                echo "::error::package-manager pip needs the hash-pinned '$REQUIREMENTS_FILE' (see the requirements-file input)"
                exit 1
              fi
              pip install --no-cache-dir --require-hashes -r "$REQUIREMENTS_FILE"
              pip install --no-cache-dir --no-deps -e .
              ;;
          esac

      - name: Test
        run: |
          COV_ARGS=""
          if [ "${{ inputs.run-coverage }}" = "true" ] && [ "${{ matrix.python-version }}" = "${{ inputs.python-version }}" ]; then
            COV_ARGS="--cov --cov-report=xml --cov-fail-under=${{ inputs.coverage-threshold }}"
          fi
          case "${{ inputs.package-manager }}" in
            poetry) poetry run pytest ${COV_ARGS:+"$COV_ARGS"} ;;
            uv)     uv run pytest ${COV_ARGS:+"$COV_ARGS"} ;;
            *)      pytest ${COV_ARGS:+"$COV_ARGS"} ;;
          esac

      - name: Upload coverage
        if: inputs.run-coverage && matrix.python-version == inputs.python-version
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
