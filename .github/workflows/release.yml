name: Release

on:
  workflow_call:
    inputs:
      language:
        description: 'Project language (rust, python, node, go)'
        required: true
        type: string
      dry-run:
        description: 'Perform a dry run without publishing'
        default: false
        type: boolean
      rust-targets:
        description: 'JSON array of {target, os} for cross-compilation (Rust only)'
        default: '[{"target":"x86_64-unknown-linux-gnu","os":"ubuntu-latest"}]'
        type: string
      go-targets:
        description: 'JSON array of {goos, goarch, os} for cross-compilation (Go only)'
        default: '[{"goos":"linux","goarch":"amd64","os":"ubuntu-latest"}]'
        type: string
    secrets:
      CRATES_TOKEN:
        description: 'crates.io API token (fallback if Trusted Publishing not configured)'
        required: false
      PYPI_TOKEN:
        description: 'PyPI API token (fallback if Trusted Publishing not configured)'
        required: false
      NPM_TOKEN:
        description: 'npm API token'
        required: false

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  # ─── Rust ──────────────────────────────────────────────────────────
  build-rust:
    name: Build (${{ matrix.platform.target }})
    if: inputs.language == 'rust'
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        platform: ${{ fromJson(inputs.rust-targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          targets: ${{ matrix.platform.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.platform.target }}
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      # Cross linkers for the Linux targets ubuntu-latest cannot build
      # unaided. Crates with cc-rs build scripts — onig_sys, ring, openssl-sys
      # — invoke the target's gcc directly, and without it the build dies
      # with, for example:
      #
      #   error occurred in cc-rs: failed to find tool
      #   "aarch64-linux-gnu-gcc": No such file or directory
      #
      # Because the matrix is fail-fast, one absent linker cancels every other
      # target and skips the release job with them. staticdatagen dropped
      # aarch64 and then musl for exactly this reason and published by hand
      # from v0.0.9 to v0.0.16.
      #
      # CARGO_TARGET_*_LINKER is what actually makes cargo link with the cross
      # compiler; installing the package alone is not enough.
      - name: Install cross linker
        if: runner.os == 'Linux' && matrix.platform.target != 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.platform.target }}" in
            aarch64-unknown-linux-gnu)
              sudo apt-get update
              sudo apt-get install -y gcc-aarch64-linux-gnu
              {
                echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
                echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
                echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar"
              } >> "$GITHUB_ENV"
              ;;
            x86_64-unknown-linux-musl)
              sudo apt-get update
              sudo apt-get install -y musl-tools
              {
                echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc"
                echo "CC_x86_64_unknown_linux_musl=musl-gcc"
              } >> "$GITHUB_ENV"
              ;;
            *)
              echo "no cross linker needed for ${{ matrix.platform.target }}"
              ;;
          esac

      - run: cargo build --release --target ${{ matrix.platform.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p target/package
          tar czf target/package/${{ matrix.platform.target }}.tar.gz -C target/${{ matrix.platform.target }}/release .

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.platform.target }}.tar.gz
          path: target/package/${{ matrix.platform.target }}.tar.gz
          retention-days: 1

  release-rust:
    name: Release Rust
    if: inputs.language == 'rust'
    needs: build-rust
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Get version
        id: version
        run: |
          VERSION=$(cargo metadata --format-version 1 --no-deps 2>/dev/null | jq -r '.packages[0].version' 2>/dev/null || grep '^version' Cargo.toml | head -1 | cut -d '"' -f 2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Everything this job produces lands in RUNNER_TEMP, never in the
      # checkout.
      #
      # `cargo publish` refuses to run against a dirty working tree, and
      # downloading artifacts into `artifacts/` plus writing
      # `sbom.spdx.json` at the repo root made it dirty on every release:
      #
      #   error: 5 files in the working directory contain changes that were
      #   not yet committed into git
      #
      # `--allow-dirty` would silence that and make it worse — the artifacts
      # and the SBOM would be packaged into the published .crate. Keeping
      # them outside the checkout is the actual fix.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/artifacts

      - name: Create release
        if: ${{ !inputs.dry-run }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: true
          files: ${{ runner.temp }}/artifacts/**/*.tar.gz

      - name: Attest build provenance
        if: ${{ !inputs.dry-run }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: '${{ runner.temp }}/artifacts/**/*.tar.gz'

      - name: Generate SBOM
        if: ${{ !inputs.dry-run }}
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          # Scans the checkout, writes outside it.
          path: .
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom.spdx.json

      - name: Upload SBOM to release
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ steps.version.outputs.version }}" "${RUNNER_TEMP}/sbom.spdx.json" --clobber

      # Fail loudly rather than letting cargo publish report it three steps
      # later, where the cause is much less obvious.
      - name: Working tree must be clean before publishing
        if: ${{ !inputs.dry-run }}
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::working tree is dirty; cargo publish will refuse"
            git status --short
            exit 1
          fi
          echo "working tree clean"

      - name: Install Rust toolchain
        if: ${{ !inputs.dry-run }}
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable

      # Trusted publishing: swaps this job's GitHub OIDC identity for a
      # temporary crates.io token, revoked by the action's post step when
      # the job ends. release-rust already requests id-token: write for
      # build attestation, so no new permission is needed.
      #
      # crates.io validates the `workflow_ref` claim, which names the
      # CALLING workflow -- so each caller registers its own repository
      # and its own release.yml on crates.io, not this shared workflow.
      - name: Authenticate with crates.io
        id: crates-auth
        if: ${{ !inputs.dry-run }}
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish to crates.io
        if: ${{ !inputs.dry-run }}
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}

  # ─── Python ────────────────────────────────────────────────────────
  release-python:
    name: Release Python
    runs-on: ubuntu-latest
    if: inputs.language == 'python'
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # The hash-pinned requirements live in this repository's
      # requirements/ directory and are fetched at the exact commit of
      # this workflow, so a caller pinning this workflow by SHA also
      # pins every tool it installs. actionlint 1.7.12 does not know
      # job.workflow_sha yet, so the step reads it from toJSON(job).
      - name: Fetch hash-pinned tool requirements
        env:
          JOB_CONTEXT: ${{ toJSON(job) }}
          FILES: poetry
        run: |
          repo=$(jq -r '.workflow_repository // empty' <<<"$JOB_CONTEXT")
          sha=$(jq -r '.workflow_sha // empty' <<<"$JOB_CONTEXT")
          if [ -z "$repo" ] || [ -z "$sha" ]; then
            echo "::error::job.workflow_sha is unavailable, so the pinned requirements cannot be fetched"
            exit 1
          fi
          dir="$RUNNER_TEMP/pipelines-requirements"
          mkdir -p "$dir"
          for f in $FILES; do
            curl -fsSL --proto '=https' --retry 3 -o "$dir/$f.txt" \
              "https://raw.githubusercontent.com/$repo/$sha/requirements/$f.txt"
          done

      - name: Install & build
        run: |
          pip install --no-cache-dir --require-hashes -r "$RUNNER_TEMP/pipelines-requirements/poetry.txt"
          poetry install
          poetry run pytest
          poetry build

      - name: Get version
        id: version
        run: echo "version=$(poetry version -s)" >> "$GITHUB_OUTPUT"

      - name: Create release
        if: ${{ !inputs.dry-run }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: dist/*

      - name: Attest build provenance
        if: ${{ !inputs.dry-run }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*'

      - name: Generate SBOM
        if: ${{ !inputs.dry-run }}
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom.spdx.json

      - name: Upload SBOM to release
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ steps.version.outputs.version }}" "${RUNNER_TEMP}/sbom.spdx.json" --clobber

      - name: Publish to PyPI (OIDC Trusted Publishing)
        if: ${{ !inputs.dry-run }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1
        with:
          # Uses OIDC when Trusted Publishing is configured on PyPI.
          # Falls back to token if not configured.
          password: ${{ secrets.PYPI_TOKEN || '' }}

  # ─── Node.js ───────────────────────────────────────────────────────
  release-node:
    name: Release Node
    runs-on: ubuntu-latest
    if: inputs.language == 'node'
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v2
        with:
          version: 9

      - name: Install, test & build
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build

      - name: Get version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create release
        if: ${{ !inputs.dry-run }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true

      - name: Attest build provenance
        if: ${{ !inputs.dry-run }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'package.json'

      - name: Generate SBOM
        if: ${{ !inputs.dry-run }}
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom.spdx.json

      - name: Upload SBOM to release
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ steps.version.outputs.version }}" "${RUNNER_TEMP}/sbom.spdx.json" --clobber

      - name: Publish to npm
        if: ${{ !inputs.dry-run }}
        run: pnpm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ─── Go ────────────────────────────────────────────────────────────
  build-go:
    name: Build (${{ matrix.platform.goos }}/${{ matrix.platform.goarch }})
    if: inputs.language == 'go'
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        platform: ${{ fromJson(inputs.go-targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'

      - name: Build
        env:
          GOOS: ${{ matrix.platform.goos }}
          GOARCH: ${{ matrix.platform.goarch }}
          CGO_ENABLED: '0'
        run: |
          OUTPUT_NAME="${{ github.event.repository.name }}-${{ matrix.platform.goos }}-${{ matrix.platform.goarch }}"
          go build -trimpath -ldflags="-s -w" -o "${OUTPUT_NAME}" .
          tar czf "${OUTPUT_NAME}.tar.gz" "${OUTPUT_NAME}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.platform.goos }}-${{ matrix.platform.goarch }}.tar.gz
          path: '*.tar.gz'
          retention-days: 1

  release-go:
    name: Release Go
    if: inputs.language == 'go'
    needs: build-go
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Get version
        id: version
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo "0.0.0")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/artifacts

      - name: Create release
        if: ${{ !inputs.dry-run }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: ${{ runner.temp }}/artifacts/**/*.tar.gz

      - name: Attest build provenance
        if: ${{ !inputs.dry-run }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: '${{ runner.temp }}/artifacts/**/*.tar.gz'

      - name: Generate SBOM
        if: ${{ !inputs.dry-run }}
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom.spdx.json

      - name: Upload SBOM to release
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ steps.version.outputs.version }}" "${RUNNER_TEMP}/sbom.spdx.json" --clobber
