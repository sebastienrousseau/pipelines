name: Documentation

on:
  workflow_call:
    inputs:
      type:
        description: 'Documentation type (rust, python-mkdocs, python-sphinx, static)'
        required: true
        type: string
      deploy:
        description: 'Deploy to GitHub Pages'
        default: true
        type: boolean
      working-directory:
        description: 'Working directory'
        default: '.'
        type: string
      output-directory:
        description: 'Output directory for built docs'
        default: ''
        type: string
      python-version:
        description: 'Python version (for Python docs)'
        default: '3.12'
        type: string
      rust-version:
        description: 'Rust toolchain version'
        default: 'nightly'
        type: string
      cname:
        description: 'Custom domain for GitHub Pages'
        default: ''
        type: string
      redirect-crate:
        description: 'Crate name for index.html redirect (Rust only)'
        default: ''
        type: string

permissions: {}

jobs:
  build-rust:
    name: Build Rust Docs
    runs-on: ubuntu-latest
    if: inputs.type == 'rust'
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - id: toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ inputs.rust-version }}

      # dtolnay/rust-toolchain only runs `rustup default`, and a caller's
      # rust-toolchain.toml beats the default. A repo that pins `stable`
      # there ran its MSRV and nightly jobs on stable while they reported
      # green. RUSTUP_TOOLCHAIN beats the file, so export it for every
      # later step, then prove the compiler in use is the one requested.
      - name: Pin the requested toolchain
        shell: bash
        env:
          TOOLCHAIN: ${{ steps.toolchain.outputs.name }}
        run: echo "RUSTUP_TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"

      - name: Verify the toolchain in use
        shell: bash
        env:
          REQUESTED: ${{ inputs.rust-version }}
          TOOLCHAIN: ${{ steps.toolchain.outputs.name }}
        run: |
          actual="$(rustc --version)"
          expected="$(rustc "+$TOOLCHAIN" --version)"
          case "$REQUESTED" in
            stable) pattern='^rustc [0-9]+\.[0-9]+\.[0-9]+ \(' ;;
            beta) pattern='-beta' ;;
            nightly*) pattern='-nightly' ;;
            [0-9]*) pattern="^rustc ${REQUESTED//./\\.}[. ]" ;;
            *) pattern='' ;;
          esac
          echo "requested $REQUESTED, in use: $actual"
          if [ "$actual" != "$expected" ] || ! grep -Eq -- "${pattern:-.}" <<<"$actual"; then
            echo "::error::rustc in use is '$actual', not the requested $REQUESTED ($expected)"
            exit 1
          fi

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: docs
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build documentation
        working-directory: ${{ inputs.working-directory }}
        run: |
          RUSTDOCFLAGS="--cfg docsrs" cargo doc --no-deps --all-features --workspace
          if [ -n "${{ inputs.redirect-crate }}" ]; then
            echo '<html><head><meta http-equiv="refresh" content="0; url=/${{ inputs.redirect-crate }}/"></head><body></body></html>' > target/doc/index.html
          fi
          if [ -n "${{ inputs.cname }}" ]; then
            echo '${{ inputs.cname }}' > target/doc/CNAME
          fi

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ inputs.working-directory }}/target/doc

  build-mkdocs:
    name: Build MkDocs
    runs-on: ubuntu-latest
    if: inputs.type == 'python-mkdocs'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}

      # The hash-pinned requirements live in this repository's
      # requirements/ directory and are fetched at the exact commit of
      # this workflow, so a caller pinning this workflow by SHA also
      # pins every tool it installs. actionlint 1.7.12 does not know
      # job.workflow_sha yet, so the step reads it from toJSON(job).
      - name: Fetch hash-pinned tool requirements
        env:
          JOB_CONTEXT: ${{ toJSON(job) }}
          FILES: mkdocs
        run: |
          repo=$(jq -r '.workflow_repository // empty' <<<"$JOB_CONTEXT")
          sha=$(jq -r '.workflow_sha // empty' <<<"$JOB_CONTEXT")
          if [ -z "$repo" ] || [ -z "$sha" ]; then
            echo "::error::job.workflow_sha is unavailable, so the pinned requirements cannot be fetched"
            exit 1
          fi
          dir="$RUNNER_TEMP/pipelines-requirements"
          mkdir -p "$dir"
          for f in $FILES; do
            curl -fsSL --proto '=https' --retry 3 -o "$dir/$f.txt" \
              "https://raw.githubusercontent.com/$repo/$sha/requirements/$f.txt"
          done

      # A caller's own docs requirements must carry hashes as well
      # (`uv pip compile --generate-hashes`): pip then verifies every
      # package it installs, not only the ones this workflow picks.
      - name: Install & build
        working-directory: ${{ inputs.working-directory }}
        run: |
          pip install --no-cache-dir --require-hashes -r "$RUNNER_TEMP/pipelines-requirements/mkdocs.txt"
          if [ -f requirements-docs.txt ]; then pip install --no-cache-dir --require-hashes -r requirements-docs.txt; fi
          mkdocs build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ inputs.working-directory }}/site

  build-sphinx:
    name: Build Sphinx
    runs-on: ubuntu-latest
    if: inputs.type == 'python-sphinx'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}

      # The hash-pinned requirements live in this repository's
      # requirements/ directory and are fetched at the exact commit of
      # this workflow, so a caller pinning this workflow by SHA also
      # pins every tool it installs. actionlint 1.7.12 does not know
      # job.workflow_sha yet, so the step reads it from toJSON(job).
      - name: Fetch hash-pinned tool requirements
        env:
          JOB_CONTEXT: ${{ toJSON(job) }}
          FILES: sphinx
        run: |
          repo=$(jq -r '.workflow_repository // empty' <<<"$JOB_CONTEXT")
          sha=$(jq -r '.workflow_sha // empty' <<<"$JOB_CONTEXT")
          if [ -z "$repo" ] || [ -z "$sha" ]; then
            echo "::error::job.workflow_sha is unavailable, so the pinned requirements cannot be fetched"
            exit 1
          fi
          dir="$RUNNER_TEMP/pipelines-requirements"
          mkdir -p "$dir"
          for f in $FILES; do
            curl -fsSL --proto '=https' --retry 3 -o "$dir/$f.txt" \
              "https://raw.githubusercontent.com/$repo/$sha/requirements/$f.txt"
          done

      # As for MkDocs, a caller's own docs requirements must carry hashes.
      - name: Install & build
        working-directory: ${{ inputs.working-directory }}
        run: |
          pip install --no-cache-dir --require-hashes -r "$RUNNER_TEMP/pipelines-requirements/sphinx.txt"
          if [ -f requirements-docs.txt ]; then pip install --no-cache-dir --require-hashes -r requirements-docs.txt; fi
          if [ -f docs/requirements.txt ]; then pip install --no-cache-dir --require-hashes -r docs/requirements.txt; fi
          cd docs && make html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ inputs.working-directory }}/docs/_build/html

  build-static:
    name: Build Static
    runs-on: ubuntu-latest
    if: inputs.type == 'static'
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ inputs.output-directory || inputs.working-directory }}

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build-rust, build-mkdocs, build-sphinx, build-static]
    if: |
      always() &&
      inputs.deploy &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (needs.build-rust.result == 'success' ||
       needs.build-mkdocs.result == 'success' ||
       needs.build-sphinx.result == 'success' ||
       needs.build-static.result == 'success')
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
